{{- $current := .Page.File.Path -}}
<p>系列文章</p>
<ul>
  {{- range where site.RegularPages "Section" "post" -}}
    {{- if strings.HasPrefix .File.Path "post/nvim_" -}}
      <li>
        <a href="{{ .RelPermalink }}">
          {{- .Title -}}{{ with .Params.summary }} - {{ . }}{{ end }}
        </a>
        {{ if eq $current .File.Path }} &lt;- 現在位置{{ end }}
      </li>
    {{- end -}}
  {{- end -}}
</ul>
