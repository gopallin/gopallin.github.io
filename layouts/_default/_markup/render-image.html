<img src="{{ .Destination | safeURL }}"
     alt="{{ .Text }}"
     {{ with .Title }}
       {{ if strings.HasSuffix . "px" }}width="{{ . }}"
       {{ else if strings.HasSuffix . "%" }}width="{{ . }}"
       {{ else if findRE `^\d+$` . }}width="{{ . }}px"
       {{ else }}title="{{ . }}"{{ end }}
     {{ end }} />
